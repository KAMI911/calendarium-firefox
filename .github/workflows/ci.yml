name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  install-lint-test-build:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - run: npx web-ext build --source-dir=src --artifacts-dir=dist
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip

  sign-and-release:
    name: Sign (AMO) and publish GitHub Release
    needs: install-lint-test-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Sync manifest.json/package.json version from the tag
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs
      - name: Submit to AMO (listed channel) — don't block on human review
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        # Listed submissions go through Mozilla review, which can take
        # anywhere from minutes to days — nothing something CI should ever
        # block on. --approval-timeout=0 makes web-ext upload + validate
        # and return immediately without waiting for a signed .xpi (which
        # only exists once a human reviewer approves it). The GitHub
        # Release below therefore ships the *unsigned* build, with a note
        # pointing at the AMO version page for the signed download once
        # it's approved.
        run: |
          npx web-ext sign --source-dir=src --artifacts-dir=dist-signed \
            --api-key="$WEB_EXT_API_KEY" --api-secret="$WEB_EXT_API_SECRET" \
            --channel=listed --amo-metadata=amo-metadata.json --approval-timeout=0
      - run: npx web-ext build --source-dir=src --artifacts-dir=dist --overwrite-dest
      - name: Create GitHub Release with the unsigned build attached
        uses: softprops/action-gh-release@v3
        with:
          name: "Calendarium ${{ github.ref_name }}"
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Submitted to addons.mozilla.org for review (listed channel).
            The attached `.zip` is the unsigned build; the AMO-signed
            `.xpi` becomes available once a Mozilla reviewer approves this
            version — check https://addons.mozilla.org/developers/addon/calendarium/versions
            for status.
